<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion-зріз 2026 — Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f0f0e; --panel:#181817; --panel2:#20201e; --line:#2b2b28; --text:#ecebe6; --muted:#8f8e88; --accent:#d2ff50;
          --css:#7ce0a0; --js:#ffd36b; --gl:#ff8a7a; --ease:cubic-bezier(0.22,1,0.36,1); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Manrope, ui-sans-serif, system-ui, sans-serif; }
  a { color:inherit; }
  .wrap { max-width:1600px; margin:0 auto; padding:0 48px; }
  header { padding:72px 0 32px; }
  header h1 { font-size:clamp(44px,6vw,96px); line-height:.95; letter-spacing:-.04em; margin:0 0 20px; font-weight:500; }
  header h1 em { font-style:normal; color:var(--accent); }
  .lead { max-width:72ch; color:var(--muted); margin:0; }
  .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-top:28px; }
  .meta div { background:var(--panel); border-radius:14px; padding:16px 18px; font-size:13px; color:var(--muted); }
  .meta b { display:block; color:var(--text); font-size:13px; margin-bottom:6px; font-weight:600; }
  .meta ul { margin:0; padding-left:16px; }
  nav.bar { position:sticky; top:0; z-index:10; background:rgba(15,15,14,.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  nav.bar .wrap { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding-top:12px; padding-bottom:12px; }
  .tabs { display:flex; gap:4px; background:var(--panel); border-radius:99px; padding:4px; }
  .tabs button, .chip { all:unset; cursor:pointer; padding:6px 14px; border-radius:99px; font-size:13px; color:var(--muted); }
  .tabs button.on { background:var(--accent); color:#111; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; margin-left:auto; align-items:center; }
  .chip { border:1px solid var(--line); padding:4px 10px; font-size:12px; }
  .chip.on { border-color:var(--accent); color:var(--accent); }
  input[type=search] { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:99px; padding:6px 14px; font:inherit; font-size:13px; width:180px; }
  main { padding:32px 0 96px; }
  .grid { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:20px; }
  .card { scroll-margin-top:150px; grid-column:span 6; background:var(--panel); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; transition:transform .5s var(--ease), box-shadow .5s var(--ease); }
  .card:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .thumbs { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:2px; background:#000; }
  .thumbs img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; cursor:zoom-in; transition:opacity .3s; }
  .thumbs img:hover { opacity:.85; }
  .body { padding:20px 22px 22px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .cat { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .badge { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid; }
  .badge.css { color:var(--css); border-color:var(--css); } .badge.css\+js { color:var(--js); border-color:var(--js); } .badge.webgl { color:var(--gl); border-color:var(--gl); }
  h2 { margin:0; font-size:24px; letter-spacing:-.02em; line-height:1.15; font-weight:600; }
  h3 { margin:0; font-size:18px; letter-spacing:-.01em; font-weight:600; }
  p { margin:0; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font-size:13px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { all:unset; cursor:pointer; font-size:12px; padding:3px 10px; border-radius:99px; background:var(--panel2); }
  .examples button:hover { color:var(--accent); }
  a.go { font-size:12px; padding:3px 10px; border-radius:99px; background:var(--accent); color:#111; text-decoration:none; font-weight:600; }
  a.go:hover { filter:brightness(1.1); }
  .live { background:var(--panel2); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; font-size:13px; }
  .live .examples button { background:transparent; border:1px solid var(--line); }
  .decide { display:flex; gap:6px; margin-top:auto; padding-top:8px; align-items:center; flex-wrap:wrap; }
  .decide button { all:unset; cursor:pointer; padding:6px 14px; border-radius:99px; border:1px solid var(--line); font-size:13px; }
  .decide button.on[data-v=take] { background:var(--accent); color:#111; border-color:var(--accent); }
  .decide button.on[data-v=maybe] { background:var(--js); color:#111; border-color:var(--js); }
  .decide button.on[data-v=no] { background:#3a2422; color:#ff9b8f; border-color:#5a3330; }
  .decide textarea { flex-basis:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--text); font:inherit; font-size:13px; padding:8px 10px; min-height:38px; resize:vertical; }
  .site { grid-column:span 12; display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); }
  .site .thumbs { align-self:start; background:transparent; grid-auto-flow:row; grid-template-columns:repeat(2,1fr); align-content:start; }
  .site .thumbs img:first-child { grid-column:span 2; }
  .moments { display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .moment { border-top:1px solid var(--line); padding-top:10px; }
  .moment .top { margin-bottom:4px; }
  .small { font-size:13px; color:var(--muted); }
  .stack { display:flex; flex-wrap:wrap; gap:6px; }
  .stack span { font-size:12px; padding:2px 8px; border-radius:6px; background:var(--panel2); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:12px 12px 12px 0; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; }
  .ease-demo { width:220px; height:28px; border-radius:99px; background:var(--panel2); position:relative; cursor:pointer; }
  .ease-demo i { position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:var(--accent); transition:left 1s; }
  .ease-demo.play i { left:calc(100% - 25px); }
  .insights { display:grid; gap:12px; }
  .insights li { background:var(--panel); border-radius:14px; padding:14px 18px; list-style:none; }
  .insights { padding:0; margin:0 0 40px; }
  .hidden { display:none !important; }
  .count { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .export { all:unset; cursor:pointer; font-size:13px; padding:6px 14px; border-radius:99px; background:var(--panel); border:1px solid var(--line); }
  .export:hover { border-color:var(--accent); color:var(--accent); }
  dialog { border:0; padding:0; background:transparent; max-width:92vw; }
  dialog img { max-width:92vw; max-height:88vh; border-radius:12px; display:block; }
  dialog::backdrop { background:rgba(0,0,0,.85); }
  .flash { animation: flash 1.2s var(--ease); }
  @keyframes flash { 0% { box-shadow:0 0 0 2px var(--accent); } 100% { box-shadow:0 0 0 0 transparent; } }
  @media (max-width:1100px){ .card{grid-column:span 12} .site{grid-template-columns:1fr} .wrap{padding:0 24px} }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

</div></nav>
<main class="wrap">

</main>

const TL = { 'css':'CSS', 'css+js':'CSS + JS', 'webgl':'WebGL' };
const CATS = { 'page-transition':'Перехід / розділи','scroll-reveal':'Scroll reveal','scroll-linked':'Scroll-linked','text':'Текст','carousel':'Карусель / список','hover':'Hover','cursor':'Курсор','menu':'Меню / навігація','loader':'Вхід / лоадер','micro':'Мікро','media':'Медіа' };
const HOW = { 'loader':'одразу при відкритті (онови сторінку)','scroll-reveal':'проскроль униз','scroll-linked':'повільно скроль униз','text':'перший екран і заголовки на скролі','carousel':'список робіт / стрічка','hover':'наведи курсор на кнопки й картки','cursor':'поводь мишею по першому екрану','menu':'навігація збоку чи зверху','page-transition':'скроль між розділами','micro':'дрібні елементи інтерфейсу','media':'фото й відео на скролі' };
const sitesById = Object.fromEntries(DATA.sites.map(s => [s.id, s]));
const KEY = 'toolkit-motion-2026-decisions';
let decisions = {};
try { decisions = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(decisions)); } catch {} };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const badge = (t) => `<span class="badge ${t}">${TL[t] || t}</span>`;

document.getElementById('lead').textContent =
  `Тестовий розбір ${DATA.sites.length} сайтів 2026 року: ${DATA.sites.reduce((n, s) => n + s.moments.length, 0)} анімаційних моментів зведено в ${DATA.patterns.length} патернів. Скріншоти — лише орієнтир: анімації дивись наживо за жовтими кнопками «↗», біля кожної підказка, де саме шукати. Параметри виміряні в браузері, якщо сайт їх не ховає в бандлі. Оціни патерни: «Взяти» потрапить у наші пресети.`;
document.getElementById('meta').innerHTML = `
  <div><b>Джерела</b><ul>${DATA.meta.sources.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></div>
  <div><b>Не покрито в тесті</b><ul>${DATA.meta.notCovered.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></div>
  <div><b>Переносимість</b>${badge('css')} лише CSS · ${badge('css+js')} CSS + трохи JS / GSAP · ${badge('webgl')} потрібен WebGL — беремо ідею, не реалізацію</div>`;

// Filters
const state = { cat: null, transfer: null, decision: null, q: '' };
function renderFilters(tab) {
  const f = document.getElementById('filters');
  if (tab === 'easing') { f.innerHTML = ''; return; }
  const cats = [...new Set((tab === 'patterns' ? DATA.patterns : DATA.sites.flatMap((s) => s.moments)).map((x) => x.cat))];
  f.innerHTML = `
    <input type="search" placeholder="Пошук…" value="${esc(state.q)}" id="q">
    ${['css', 'css+js', 'webgl'].map((t) => `<button class="chip ${state.transfer === t ? 'on' : ''}" data-transfer="${t}">${TL[t]}</button>`).join('')}
    ${cats.map((c) => `<button class="chip ${state.cat === c ? 'on' : ''}" data-cat="${c}">${CATS[c] || c}</button>`).join('')}
    ${tab === 'patterns' ? `${[['take', 'Взяти'], ['maybe', 'Може'], ['no', 'Ні'], ['none', 'Без рішення']].map(([v, l]) => `<button class="chip ${state.decision === v ? 'on' : ''}" data-decision="${v}">${l}</button>`).join('')}
      <button class="export" id="export">Експорт рішень</button>` : ''}`;
}
document.getElementById('filters').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'export') return exportDecisions();
  for (const k of ['cat', 'transfer', 'decision']) if (b.dataset[k]) state[k] = state[k] === b.dataset[k] ? null : b.dataset[k];
  render();
});
document.getElementById('filters').addEventListener('input', (e) => { if (e.target.id === 'q') { state.q = e.target.value; render(true); } });

function match(text) { return !state.q || text.toLowerCase().includes(state.q.toLowerCase()); }

function renderPatterns() {
  const list = DATA.patterns.filter((p) =>
    (!state.cat || p.cat === state.cat) && (!state.transfer || p.transfer === state.transfer) &&
    (!state.decision || (state.decision === 'none' ? !decisions[p.id]?.v : decisions[p.id]?.v === state.decision)) &&
    match(p.name + p.what + p.forUs));
  const counts = { take: 0, maybe: 0, no: 0 };
  Object.values(decisions).forEach((d) => d.v && counts[d.v]++);
  document.getElementById('patterns').innerHTML = `
    <div class="count">Показано ${list.length} з ${DATA.patterns.length} · Взяти ${counts.take} · Може ${counts.maybe} · Ні ${counts.no}</div>
    <div class="grid">${list.map((p) => {
      const shots = p.examples.map((id) => sitesById[id]?.shots?.[0]).filter(Boolean).slice(0, 3);
      const d = decisions[p.id] || {};
      return `<article class="card" id="p-${p.id}">
        ${shots.length ? `<div class="thumbs">${shots.map((s) => `<img src="${s}" loading="lazy" alt="">`).join('')}</div>` : ''}
        <div class="body">
          <div class="top"><span class="cat">${CATS[p.cat] || p.cat}</span>${badge(p.transfer)}</div>
          <h2>${esc(p.name)}</h2>
          <p>${esc(p.what)}</p>
          <dl class="kv">
            <dt>Параметри</dt><dd>${esc(p.params)}</dd>
            <dt>Для нас</dt><dd>${esc(p.forUs)}</dd>
            <dt>Не варто</dt><dd>${esc(p.avoid)}</dd>
          </dl>
          <div class="live"><b>Подивитися наживо</b> <span class="small">— ${esc(HOW[p.cat] || '')}</span>
            <div class="examples">${p.examples.map((id) => `<a class="go" href="${sitesById[id]?.url}" target="_blank" rel="noopener">${esc(sitesById[id]?.name || id)} ↗</a><button data-site="${id}" title="Розбір сайту">розбір</button>`).join('')}</div></div>
          <div class="decide" data-id="${p.id}">
            ${[['take', 'Взяти'], ['maybe', 'Може'], ['no', 'Ні']].map(([v, l]) => `<button data-v="${v}" class="${d.v === v ? 'on' : ''}">${l}</button>`).join('')}
            <textarea placeholder="Нотатка: де саме використати, що змінити…">${esc(d.note || '')}</textarea>
          </div>
        </div>
      </article>`;
    }).join('')}</div>`;
}

function renderSites() {
  const list = DATA.sites.map((s) => ({ ...s, moments: s.moments.filter((m) => (!state.cat || m.cat === state.cat) && (!state.transfer || m.transfer === state.transfer)) }))
    .filter((s) => s.moments.length && match(s.name + s.studio + s.moments.map((m) => m.name + m.what).join(' ')));
  document.getElementById('sites').innerHTML = `<div class="count">${list.length} сайтів</div><div class="grid">${list.map((s) => `
    <article class="card site" id="s-${s.id}">
      <div class="thumbs">${(s.shots || []).map((src) => `<img src="${src}" loading="lazy" alt="${esc(s.name)}">`).join('') || '<div class="body small">Без скріншотів</div>'}</div>
      <div class="body">
        <div class="top"><span class="cat">${esc(s.source)}</span></div>
        <h2>${esc(s.name)} <a class="go" href="${s.url}" target="_blank" rel="noopener">Відкрити сайт ↗</a></h2>
        <p class="small">${esc(s.studio)}</p>
        <div class="stack">${(s.stack || []).map((x) => `<span>${esc(x)}</span>`).join('')}</div>
        <dl class="kv">
          <dt>Типографіка</dt><dd>${esc(s.type)}</dd>
          ${s.easings?.length ? `<dt>Easing</dt><dd>${s.easings.map(esc).join('<br>')}</dd>` : ''}
          ${s.durations?.length ? `<dt>Тривалості</dt><dd>${s.durations.map(esc).join(' · ')}</dd>` : ''}
          ${s.note ? `<dt>Примітка</dt><dd>${esc(s.note)}</dd>` : ''}
        </dl>
        <div class="moments">${s.moments.map((m) => `
          <div class="moment"><div class="top"><span class="cat">${CATS[m.cat] || m.cat}</span>${badge(m.transfer)}</div>
          <h3>${esc(m.name)}</h3><p class="small">${esc(m.what)}</p><p class="small">⏱ ${esc(m.params)}</p>
          <p class="small"><a class="go" href="${s.url}" target="_blank" rel="noopener">Відкрити ↗</a> ${esc(HOW[m.cat] || '')}</p></div>`).join('')}</div>
      </div>
    </article>`).join('')}</div>`;
}

function renderEasing() {
  document.getElementById('easing').innerHTML = `
    <ul class="insights">${DATA.insights.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
    <h2 style="margin-bottom:12px">Easing, знайдені на сайтах</h2>
    <p class="small" style="margin-bottom:12px">Натисни на доріжку, щоб побачити криву (1s).</p>
    <table><thead><tr><th>Крива</th><th>Назва</th><th>Де</th><th>Демо</th></tr></thead><tbody>
    ${DATA.easings.map((e) => `<tr><td><code>${esc(e.curve)}</code></td><td>${esc(e.name)}</td><td>${esc(e.where)}</td>
      <td>${e.curve.startsWith('cubic') ? `<div class="ease-demo" data-curve="${e.curve}"><i style="transition-timing-function:${e.curve}"></i></div>` : '—'}</td></tr>`).join('')}
    </tbody></table>`;
}

let tab = 'patterns';
function render(keepFocus) {
  if (!keepFocus) renderFilters(tab);
  if (tab === 'patterns') renderPatterns();
  if (tab === 'sites') renderSites();
  if (tab === 'easing') renderEasing();
}
document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; state.cat = state.transfer = state.decision = null;
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  ['patterns', 'sites', 'easing'].forEach((id) => document.getElementById(id).classList.toggle('hidden', id !== tab));
  render(); scrollTo({ top: 0 });
});

document.addEventListener('click', (e) => {
  const img = e.target.closest('.thumbs img');
  if (img) { const d = document.getElementById('zoom'); const z = d.querySelector('img'); z.style.display = ''; z.src = img.src; const ta = d.querySelector('textarea'); if (ta) ta.style.display = 'none'; d.showModal(); return; }
  if (e.target.closest('#zoom') && !e.target.closest('textarea')) { document.getElementById('zoom').close(); return; }
  const ex = e.target.closest('[data-site]');
  if (ex) {
    document.querySelector('[data-tab=sites]').click();
    requestAnimationFrame(() => { const el = document.getElementById('s-' + ex.dataset.site); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1300); } });
    return;
  }
  const dv = e.target.closest('.decide button');
  if (dv) {
    const id = dv.parentElement.dataset.id; const cur = decisions[id] || {};
    decisions[id] = { ...cur, v: cur.v === dv.dataset.v ? null : dv.dataset.v }; save();
    renderPatterns(); return;
  }
  const ed = e.target.closest('.ease-demo');
  if (ed) ed.classList.toggle('play');
});
document.addEventListener('change', (e) => {
  if (e.target.matches('.decide textarea')) {
    const id = e.target.parentElement.dataset.id; decisions[id] = { ...(decisions[id] || {}), note: e.target.value }; save();
  }
});
function exportDecisions() {
  const out = DATA.patterns.filter((p) => decisions[p.id]?.v || decisions[p.id]?.note)
    .map((p) => ({ id: p.id, name: p.name, decision: decisions[p.id]?.v || null, note: decisions[p.id]?.note || '' }));
  const text = JSON.stringify(out, null, 2);
  const done = () => alertLike('Рішення скопійовано — встав їх у чат.');
  const fallback = () => {
    const d = document.getElementById('zoom'); d.querySelector('img').style.display = 'none';
    let ta = d.querySelector('textarea');
    if (!ta) { ta = document.createElement('textarea'); ta.style.cssText = 'width:min(720px,90vw);height:60vh;background:#181817;color:#ecebe6;border:1px solid #2b2b28;border-radius:12px;padding:12px;font:13px ui-monospace,monospace'; d.append(ta); }
    ta.style.display = ''; ta.value = text; d.showModal(); ta.select();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch { fallback(); }
}
function alertLike(msg) {
  const n = document.createElement('div');
  n.textContent = msg;
  n.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#d2ff50;color:#111;padding:10px 18px;border-radius:99px;font-size:14px;z-index:20';
  document.body.append(n); setTimeout(() => n.remove(), 2200);
}
render();
</script>
</body>
</html>
